<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow App • Multi-Project Task Deck</title>

    <!-- Synchronous Theme Initialization (Zero-FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('workflow-theme');
          var supportDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var t = (saved === 'light' || saved === 'dark') ? saved : (supportDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          document.documentElement.classList.add('preload');

          window.addEventListener('DOMContentLoaded', function() {
            requestAnimationFrame(function() {
              document.documentElement.classList.remove('preload');
            });
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
